# docker-compose.yml — mise-en-place
# PostgreSQL 17 for local development, reachable from this machine only.
# Start it with: docker compose up -d db
# The Pi uses docker-compose.prod.yml instead (see docs/deployment.md).
#
# On first start with an empty volume, Postgres creates POSTGRES_DB (the dev
# database) and runs docker/initdb/, which creates the test database.

services:
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # 127.0.0.1 only: Docker's published ports bypass host firewalls (S2)
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
