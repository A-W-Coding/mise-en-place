# CI workflow — mise-en-place
# Runs on push to main/develop* and on PRs to main.
# Starts a throwaway PostgreSQL service, then installs, generates the Prisma
# client, lints, type-checks and runs the tests with coverage, then puts the
# coverage totals on the run's summary page.

name: CI

on:
  push:
    branches: [ main, 'develop*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: recipe_test
        ports:
          - 5432:5432
        # Wait until Postgres accepts connections before the steps start
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Ends in _test, so the test guard allows it. There's no .env.test in CI.
      DATABASE_URL: postgresql://test:test@localhost:5432/recipe_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      # The tests don't type-check (ts-jest only transpiles), so do it here
      - name: Type-check
        run: npx tsc --noEmit

      - name: Test with coverage
        run: npm test -- --coverage

      # Put the coverage totals on the run's summary page, even if a test
      # failed. No threshold yet: set one once coverage settles (Step 6).
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: node scripts/coverage-summary.js >> "$GITHUB_STEP_SUMMARY"
