<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- The maskable icon for Android: the background fills the square, since the
       launcher cuts its own shape, and the mark sits well inside the safe zone
       (a circle of 40% of the width around the centre). -->
