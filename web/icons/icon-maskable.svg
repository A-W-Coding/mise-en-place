  <g fill="#ffffff" transform="translate(256 256) scale(0.78) translate(-256 -286)">
    <circle cx="180" cy="214" r="30"/>
    <circle cx="256" cy="186" r="30"/>
    <circle cx="332" cy="214" r="30"/>
    <path d="M128 276h256a128 128 0 0 1-256 0z"/>
    <rect x="196" y="410" width="120" height="26" rx="13"/>
  </g>
</svg>
